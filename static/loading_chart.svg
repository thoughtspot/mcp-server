<svg xmlns="http://www.w3.org/2000/svg" width="280" height="180" viewBox="0 0 280 180">
  <defs>
    <clipPath id="circleClip">
      <circle cx="185" cy="42" r="30"/>
    </clipPath>
  </defs>

  <!-- striped circle (right half of magnifying glass area) -->
  <g clip-path="url(#circleClip)">
    <rect x="155" y="12" width="60" height="60" fill="#ffffff"/>
    <g fill="#5b6572">
      <rect x="155" y="12" width="60" height="4"/>
      <rect x="155" y="20" width="60" height="4"/>
      <rect x="155" y="28" width="60" height="4"/>
      <rect x="155" y="36" width="60" height="4"/>
      <rect x="155" y="44" width="60" height="4"/>
      <rect x="155" y="52" width="60" height="4"/>
      <rect x="155" y="60" width="60" height="4"/>
      <rect x="155" y="68" width="60" height="4"/>
    </g>
  </g>

  <!-- magnifying glass outline -->
  <circle cx="150" cy="45" r="32" fill="none" stroke="#c3c9cf" stroke-width="7"/>
  <line x1="127" y1="68" x2="100" y2="95" stroke="#c3c9cf" stroke-width="9" stroke-linecap="round"/>

  <!-- bar chart, bottom left -->
  <rect x="55" y="75" width="12" height="30" fill="#5b6572"/>

  <!-- dot grid -->
  <g fill="#8f96a0">
    <circle cx="80" cy="76" r="2"/>
    <circle cx="88" cy="76" r="2"/>
    <circle cx="96" cy="76" r="2"/>
    <circle cx="80" cy="84" r="2"/>
    <circle cx="88" cy="84" r="2"/>
    <circle cx="96" cy="84" r="2"/>
    <circle cx="80" cy="92" r="2"/>
    <circle cx="88" cy="92" r="2"/>
    <circle cx="96" cy="92" r="2"/>
    <circle cx="80" cy="100" r="2"/>
    <circle cx="88" cy="100" r="2"/>
    <circle cx="96" cy="100" r="2"/>
  </g>

  <!-- loading text -->
  <text x="140" y="150" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#5b6572" text-anchor="middle">Loading chart</text>
</svg>
